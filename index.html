<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="facebook-domain-verification" content="1hg65zj096mnq26ni86rsnnon476z9" />
  <title>Norte · Agência de Marketing em Manaus</title>
  <!-- Ícones da Norte. O .ico carrega 16, 32 e 48 e deixa o navegador
       escolher conforme a densidade da aba; os PNG servem quem prefere
       declaração explícita. A marca vai sobre o verde-floresta e não sobre
       transparente porque o limão sozinho tem contraste fraco demais contra
       barra de aba clara — em 16px ele sumiria. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#14261A" />

  <!-- Inline base styles — prevents the white flash between HTML arrival and
       the hashed CSS bundle, and gives the LCP element a correct background
       on first paint (FCP). -->
  <style>
    html, body { background-color: #111112; color: #F5F1E8; margin: 0; }
    #root { min-height: 100vh; background-color: #111112; }
  </style>

  <!-- Preconnect to the R2 video CDN used above-the-fold on /restaurantes-manaus
       and the main LP hero. Saves TLS/DNS on the first byte of video metadata. -->
  <link rel="preconnect" href="https://pub-a56d220bf5884e95b4762d77d7556734.r2.dev" />

  <!-- Desktop-only preload of the pizza photo. On >=lg the hero collage is
       in viewport on first paint and the photo is the LCP candidate there.
       Mobile hero is copy-only (no static <img>): the H1 is the LCP element
       on mobile, painted instantly with the preloaded Playfair below. -->
  <link rel="preload" as="image" type="image/avif" href="/photos-food/p-1.avif" media="(min-width: 769px)" fetchpriority="high" />

  <!-- Pixel do GyreHub. Fora do bloco adiado de propósito.
       Ele manda o `pageview` no load e é ele que carimba o gclid, o fbclid
       e as UTMs no cookie do visitante. Se atrasar, quem chega pelo anúncio
       e sai rápido nunca é atribuído, e atribuição é a razão de ele existir.
       São 2,3 KB com async: não disputa nada com a imagem do LCP, ao
       contrário do GTM e do fbevents, que continuam adiados abaixo.
       Substituiu a versão que apontava pro host de desenvolvimento
       (flowdesk-...easypanel.host, slug sknyr4), morto desde a migração
       pro domínio próprio. -->
  <script src="https://gyrehub.com.br/pixel.js?id=63f4f20b-41a3-46fb-94d8-942c3344a730&link=3knb27" async></script>

  <!-- Third-party tags (GTM, Meta Pixel, Google Ads) are deferred until
       after the page is interactive. They still fire within the user's session
       but don't compete with React hydration / image decode for the initial
       LCP/FCP window. The fbq + dataLayer queues are stubbed synchronously so
       any in-app push() during boot is captured and replayed on flush. -->
  <script>
    // Stub queues so app code can push events before the real scripts load.
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
    !function (f, b, e, v, n) {
      if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments) };
      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = [];
    }(window);
    fbq('init', '339396175425796');
    fbq('track', 'PageView');

    // Fila do gtag, pelo mesmo motivo do fbq: conversão disparada antes
    // do script chegar não pode se perder.
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', 'AW-18054403022');

    // Defer real loaders to first idle slot after `load`, so they never compete
    // with the LCP image / hero JS. ~1.5s extra delay vs synchronous fire.
    function __loadThirdPartyTags() {
      // GTM
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-MLK59QPC';
      document.head.appendChild(s);
      // Meta Pixel
      var m = document.createElement('script');
      m.async = true;
      m.src = 'https://connect.facebook.net/en_US/fbevents.js';
      document.head.appendChild(m);
      // Google Ads — conversões da conta Norte Marketing
      var g = document.createElement('script');
      g.async = true;
      g.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18054403022';
      document.head.appendChild(g);
    }
    function __schedulePixels() {
      if ('requestIdleCallback' in window) {
        requestIdleCallback(__loadThirdPartyTags, { timeout: 2500 });
      } else {
        setTimeout(__loadThirdPartyTags, 1500);
      }
    }
    if (document.readyState === 'complete') {
      __schedulePixels();
    } else {
      window.addEventListener('load', __schedulePixels, { once: true });
    }
  </script>
</head>

<body>
  <!-- Meta Pixel noscript fallback -->
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=339396175425796&ev=PageView&noscript=1" alt="" /></noscript>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
